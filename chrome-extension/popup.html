<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: 'Segoe UI', sans-serif;
      background: #0f0d0a;
      color: #ede9e0;
      padding: 1.2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .logo img { height: 22px; width: 22px; }
    .logo span {
      font-size: 1rem;
      font-weight: 600;
      color: #fdb201;
      letter-spacing: -0.01em;
    }
    button {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid #2e2518;
      background: #1a1510;
      color: #ede9e0;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    button:hover { background: #221c12; border-color: #fde68a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .prompt-row {
      display: flex;
      gap: 0.4rem;
      width: 100%;
    }
    .prompt-row button:first-child { flex: 1; }
    .copy-btn {
      width: 42px;
      justify-content: center;
      padding: 0;
      color: #7a7060;
    }
    .copy-btn:hover { color: #fdb201; }

    #status {
      margin-top: 0.8rem;
      font-size: 0.78rem;
      color: #7a7060;
      min-height: 1.2rem;
    }
    #status.ok { color: #7ee8b4; }
    #status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="logo"><img src="icon.png" alt="Lumina"><span>Lumina</span></div>
  <div style="display:flex;flex-direction:column;gap:0.5rem">
    <div class="prompt-row">
      <button id="btn-convert-last">
        <span>⟳</span> Convert Last
      </button>
      <button class="copy-btn" data-type="convert" title="Copy prompt">📋</button>
    </div>
    <div class="prompt-row">
      <button id="btn-fresh">
        <span>✦</span> Fresh Answer
      </button>
      <button class="copy-btn" data-type="fresh" title="Copy prompt">📋</button>
    </div>
    <div class="prompt-row">
      <button id="btn-manual">
        <span>✎</span> Manual Text
      </button>
      <button class="copy-btn" data-type="manual" title="Copy prompt">📋</button>
    </div>
  </div>

  <div style="border-top: 1px solid #2e2518; margin-top: 0.8rem; padding-top: 0.8rem">
    <button id="btn-import-page" style="justify-content: center; background: #fdb201; color: #0f0d0a; border-color: #fdb201; font-weight: 600;">
      Open Import Page
    </button>
  </div>
  <div id="status">Open ChatGPT, Gemini, or Claude first.</div>
  <script src="popup.js"></script>
</body>
</html>
